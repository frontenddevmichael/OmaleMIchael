<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Michael — Frontend developer and UI/UX designer</title>
    <meta
      name="description"
      content="Michael (Omale Michael) is a frontend developer and UI/UX designer in Lagos. Selected work, experience and resume."
    />
    <meta name="theme-color" content="#E4E4E1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Michael — Frontend developer and UI/UX designer" />
    <meta
      property="og:description"
      content="Frontend developer and UI/UX designer in Lagos. Selected work, experience and resume."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load off the critical path: the request still starts immediately,
         but the stylesheet no longer blocks first paint -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Hanken+Grotesk:wght@300..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Hanken+Grotesk:wght@300..800&display=swap"
      />
    </noscript>
    <!-- the hero image is the LCP element; the img itself carries the srcset, so
         the preload points at the full-size file retina screens pick -->
    <link rel="preload" as="image" href="/images/portrait.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
